name: Refresh official offers
on:
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: official-offer-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and build
        run: |
          python scraper.py
          python build.py
      - name: Publish snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/offers.json site
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh official offers"
            git push
          fi
      - name: Surface source outage after publishing honest empty state
        run: |
          python -c "import json; d=json.load(open('data/offers.json')); assert d['offers'], 'No verified offers; inspect source checks'"
